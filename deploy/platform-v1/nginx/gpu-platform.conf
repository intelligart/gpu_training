worker_processes 1;
pid /tmp/gpu-platform-nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:8443 ssl;
        server_name gpu-platform.internal;

        ssl_certificate /etc/gpu-platform/tls/fullchain.pem;
        ssl_certificate_key /etc/gpu-platform/tls/privkey.pem;

        location /mcp {
            proxy_pass http://127.0.0.1:8766;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}